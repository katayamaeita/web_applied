<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>分岐と反復の練習</title>
  </head>
  <body>
    <script>
      // ここにコードを入力する
      //反復1
      let stars = "";
      for (let i = 1; i <= 5; i++) {
        stars += "★";
      }
      alert(stars);
      //反復2
      for (let i = 1; i <= 10; i++) {
        if (i % 2 === 0) {
          console.log(i + " は偶数です");
        }
      }
    </script>
  </body>
</html>
